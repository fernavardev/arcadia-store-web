<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito | Arcadia Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header container text-center">
    <h1>Arcadia Store</h1>
    <p>Carrito de compras</p>
  </header>

  <nav class="site-nav container">
    <a href="index.html">Inicio</a>
    <a href="perfil.html">Perfil</a>
    <a href="mis-compras.html">Mis compras</a>
    <a href="login.html">Cerrar sesión</a>
  </nav>

  <main class="container">
    <section class="page-title text-center">
      <h2>Mi carrito</h2>
      <p>Productos agregados a tu compra simulada.</p>
    </section>

    <section class="table-responsive">
      <table class="table table-dark table-striped align-middle">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody id="tablaCarrito">
          <tr>
            <td colspan="4" class="text-center">Aún no hay productos en el carrito.</td>
          </tr>
        </tbody>
      </table>
    </section>

    <div class="register-buttons">
      <button id="btnFinalizarCompra" class="btn btn-primary">Finalizar compra</button>
      <a href="index.html" class="btn btn-secondary">Seguir comprando</a>
    </div>

    <div id="mensajeCompra" class="success-message">
      Compra realizada correctamente. Puedes revisarla en Mis compras.
    </div>
  </main>

  <footer>
    <a href="index.html">Volver al inicio</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cliente.js"></script>
</body>
</html>
