<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Arcadia Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header container text-center">
    <h1>Arcadia Store</h1>
    <p>Inicio de sesión</p>
  </header>

  <nav class="site-nav container">
    <a href="index.html">Inicio</a>
    <a href="registro.html">Registro</a>
    <a href="login.html">Login</a>
    <a href="recuperar.html">Recuperar contraseña</a>
  </nav>

  <main class="container">
    <section class="page-title text-center">
      <h2>Iniciar sesión</h2>
      <p>Accede como cliente o administrador de Arcadia Store.</p>
    </section>

    <section class="register-section">
      <form id="formLogin" class="register-form" novalidate>
        <div class="row g-4">
          <div class="col-12">
            <label for="loginCorreo" class="form-label">Correo electrónico</label>
            <input type="email" id="loginCorreo" class="form-control" placeholder="usuario@correo.com">
            <div id="errorLoginCorreo" class="error-message"></div>
          </div>

          <div class="col-12">
            <label for="loginPassword" class="form-label">Contraseña</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="Ingresa tu contraseña">
            <div id="errorLoginPassword" class="error-message"></div>
          </div>
        </div>

        <div class="register-buttons">
          <button type="submit" class="btn btn-primary">Iniciar sesión</button>
          <a href="recuperar.html" class="btn btn-secondary">Recuperar contraseña</a>
        </div>

        <div id="mensajeLogin" class="success-message">
          Inicio de sesión validado correctamente.
        </div>
      </form>
    </section>
  </main>

  <footer>
    <a href="index.html">Volver al inicio</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const formLogin = document.getElementById("formLogin");
    const loginCorreo = document.getElementById("loginCorreo");
    const loginPassword = document.getElementById("loginPassword");
    const mensajeLogin = document.getElementById("mensajeLogin");

    formLogin.addEventListener("submit", function(event) {
      event.preventDefault();

      mensajeLogin.style.display = "none";

      const usuarios = obtenerUsuarios();

      const usuarioEncontrado = usuarios.find(
        usuario => usuario.correo === loginCorreo.value.trim()
      );

      if (!usuarioEncontrado) {
        document.getElementById("errorLoginCorreo").textContent = "El correo no está registrado.";
        loginCorreo.classList.add("is-invalid");
        return;
      }

      if (usuarioEncontrado.password !== loginPassword.value) {
        document.getElementById("errorLoginPassword").textContent = "La contraseña es incorrecta.";
        loginPassword.classList.add("is-invalid");
        return;
      }

      iniciarSesion(usuarioEncontrado);

      if (usuarioEncontrado.rol === "admin") {
        window.location.href = "admin-productos.html";
      } else {
        window.location.href = "perfil.html";
      }
    });
  </script>
</body>
</html>
