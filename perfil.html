<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil | Arcadia Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header container text-center">
    <h1>Arcadia Store</h1>
    <p>Modificación de perfil</p>
  </header>

  <nav class="site-nav container">
    <a href="index.html">Inicio</a>
    <a href="carrito.html">Carrito</a>
    <a href="mis-compras.html">Mis compras</a>
    <a href="perfil.html">Perfil</a>
    <a href="login.html">Cerrar sesión</a>
  </nav>

  <main class="container">
    <section class="page-title text-center">
      <h2>Mi perfil</h2>
      <p>Actualiza tus datos personales registrados en Arcadia Store.</p>
    </section>

    <section class="register-section">
      <form id="formPerfil" class="register-form" novalidate>
        <div class="row g-4">
          <div class="col-12 col-md-6">
            <label for="perfilNombre" class="form-label">Nombre completo</label>
            <input type="text" id="perfilNombre" class="form-control">
            <div id="errorPerfilNombre" class="error-message"></div>
          </div>

          <div class="col-12 col-md-6">
            <label for="perfilUsuario" class="form-label">Nombre de usuario</label>
            <input type="text" id="perfilUsuario" class="form-control">
            <div id="errorPerfilUsuario" class="error-message"></div>
          </div>

          <div class="col-12 col-md-6">
            <label for="perfilCorreo" class="form-label">Correo electrónico</label>
            <input type="email" id="perfilCorreo" class="form-control">
            <div id="errorPerfilCorreo" class="error-message"></div>
          </div>

          <div class="col-12 col-md-6">
            <label for="perfilDireccion" class="form-label">Dirección de despacho</label>
            <input type="text" id="perfilDireccion" class="form-control">
          </div>
        </div>

        <div class="register-buttons">
          <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </div>

        <div id="mensajePerfil" class="success-message">
          Perfil actualizado correctamente.
        </div>
      </form>
    </section>
  </main>

  <footer>
    <a href="index.html">Volver al inicio</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cliente.js"></script>
</body>
</html>
